name: awesome-lint (advisory)
on:
  push:
    paths: [README.md]
  pull_request:
    paths: [README.md]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run awesome-lint (advisory until sindresorhus submission)
        run: npx awesome-lint || true
